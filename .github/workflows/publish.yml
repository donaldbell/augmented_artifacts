name: Publish Field Archive

on:
  workflow_dispatch: {}
  schedule:
    # 04:00 UTC nightly
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: publish-field-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "field-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish: sync site from Airtable"
            git push
          fi
