name: Publish Field Archive

on:
  workflow_dispatch: {}
  # Airtable (free plan) has no outgoing-webhook or script action, but it can
  # create a GitHub issue. An Airtable automation opens an issue labelled
  # "publish"; this workflow builds the site and closes the issue.
  issues:
    types: [opened]
  schedule:
    # 04:00 UTC nightly. Temporary safety net until the Airtable automation is
    # confirmed working; remove it then, since scheduled workflows get disabled
    # after 60 days without repo activity.
    - cron: '0 4 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-field-archive
  cancel-in-progress: false

jobs:
  build:
    # For issue events, only run on publish requests from the repo owner, so a
    # stranger opening an issue on this public repo can't kick off builds.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'publish'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "field-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish: sync site from Airtable"
            git push
          fi

      - name: Close the publish request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --comment "Published by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (${{ job.status }})."
